services:
  # ---------- 1. MongoDB（FiftyOne 依赖，7.0 版本） ----------
  mongodb:
    image: mongo:7.0
    container_name: fo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./datasets/mongodb:/data/db
    command: mongod --bind_ip_all
    networks:
      - cv_pipeline_net

  # ---------- 2. FiftyOne（数据集治理与数据管理） ----------
  fiftyone:
    image: voxel51/fiftyone:latest
    container_name: fo-dashboard
    restart: unless-stopped
    ports:
      - "5151:5151"
    volumes:
      - ./datasets/fiftyone:/fiftyone          # FiftyOne 系统配置与缓存
      - ./datasets/images:/media/images:ro     # 共享图像根目录（只读）
      - ./fiftyone_scripts:/scripts            # 自定义 Python 脚本目录
      - ./exports:/exports                    # YOLO 格式训练集导出目录
    environment:
      - FIFTYONE_DEFAULT_APP_ADDRESS=0.0.0.0
      - FIFTYONE_DATABASE_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb
    command: python3 -c "import fiftyone as fo; session = fo.launch_app(address='0.0.0.0', port=5151); session.wait()"
    networks:
      - cv_pipeline_net

# 指定自定义桥接网段，避开局域网 IP 冲突
networks:
  cv_pipeline_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16